{% extends "base.html" %}

{% block title %}Sign Up - Task Tracker Pro (No JS){% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">
            <i class="fas fa-user-plus"></i>
        </div>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Join Task Tracker Pro today</p>

        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" required 
                       placeholder="Choose a username" value="{{ request.form.get('username', '') }}">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" required 
                       placeholder="Enter your email" value="{{ request.form.get('email', '') }}">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" required 
                       placeholder="Create a password (min 6 characters)">
            </div>

            <div class="form-group">
                <label for="role">Role</label>
                <select name="role" id="role" required>
                    <option value="">Select your role</option>
                    <option value="employee" {{ 'selected' if request.form.get('role') == 'employee' else '' }}>Employee</option>
                    <option value="manager" {{ 'selected' if request.form.get('role') == 'manager' else '' }}>Manager</option>
                </select>
                <small style="color: var(--text-muted); margin-top: 0.5rem; display: block;">
                    Manager accounts require admin approval before access.
                </small>
            </div>

            <button type="submit" class="btn btn-primary w-full">
                <i class="fas fa-user-plus"></i>
                Create Account
            </button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="{{ url_for('auth.login') }}">Sign in here</a></p>
        </div>
    </div>
</div>
{% endblock %}
