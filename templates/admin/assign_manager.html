{% extends 'base.html' %}
{% block title %}Assign Employees to Manager{% endblock %}
{% block page_title %}Assign Employees to Manager{% endblock %}
{% block content %}
<div style="max-width: 700px; margin: 0 auto;">
  <form method="POST" class="card">
    <div class="card-body">
      <div class="form-group">
        <label for="employee_id">Select Employee</label>
        <select name="employee_id" id="employee_id" required>
          <option value="">-- Select Employee --</option>
          {% for emp in employees %}
          <option value="{{ emp.id }}">{{ emp.username }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label for="manager_id">Select Manager</label>
        <select name="manager_id" id="manager_id" required>
          <option value="">-- Select Manager --</option>
          {% for mgr in managers %}
          <option value="{{ mgr.id }}">{{ mgr.username }}</option>
          {% endfor %}
        </select>
      </div>
      <button type="submit" class="btn btn-primary w-full mt-2">Assign Manager</button>
    </div>
  </form>
</div>
{% endblock %}
